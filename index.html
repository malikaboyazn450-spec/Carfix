<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق أبو يزن العالمي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #007bff, #6610f2); color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; direction: rtl; }
        .card { background: rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 15px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); text-align: center; max-width: 400px; width: 90%; }
        h1 { margin-bottom: 15px; font-size: 24px; }
        p { font-size: 16px; line-height: 1.6; opacity: 0.9; }
        .badge { display: inline-block; background: #28a745; color: white; padding: 8px 18px; border-radius: 25px; font-weight: bold; margin-top: 20px; box-shadow: 0 4px 15px rgba(40,167,69,0.4); }
    </style>
</head>
<body>

<div class="card">
    <h1>أهلاً بك يا أبو يزن</h1>
    <p>تم إطلاق تطبيقك العالمي بنجاح رسمي وثابت على شبكة الإنترنت، ليعمل بكفاءة وسرعة فائقة.</p>
    <div class="badge">🌐 يعمل عالمياً الآن</div>
</div>

</body>
</html>
