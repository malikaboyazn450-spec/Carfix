name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Create Clean App
        run: flutter create . --org com.carfix --project-name carfix --force

      - name: Restore User Files
        run: |
          # نضمن أن مجلد lib وكود main.dart الخاص بك في مكانه الصحيح
          mkdir -p lib
          # إذا كان الملف في مكان آخر، سنتركه يعتمد على ملفاتك الموجودة

      - name: Build APK Release
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
